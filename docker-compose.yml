services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      # Mounts local folder so PHP changes update live without rebuilding
      - .:/var/www/html
    environment:
      # Database connection variables available to PHP
      DB_HOST: db
      DB_NAME: my_database
      DB_USER: db_user
      DB_PASSWORD: db_password
    depends_on:
      - db

  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: my_database
      MARIADB_USER: db_user
      MARIADB_PASSWORD: db_password
    ports:
      - "3306:3306"
    volumes:
      # Persists MariaDB data on your host machine so data survives container restarts
      - mariadb_data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: db_user
      PMA_PASSWORD: db_password
    depends_on:
      - db
volumes:
  mariadb_data: